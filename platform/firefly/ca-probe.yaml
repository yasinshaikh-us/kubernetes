# A certificate issued by Firefly. Its ca.crt is the Firefly root, which trust-manager distributes.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: firefly-ca
  namespace: cert-manager
  annotations:
    firefly.venafi.com/policy-name: istio-mesh
spec:
  secretName: firefly-ca
  commonName: firefly-ca-probe.cert-manager.svc
  dnsNames: [firefly-ca-probe.cert-manager.svc]
  duration: 24h
  privateKey: { algorithm: ECDSA, size: 256 }
  issuerRef:
    group: firefly.venafi.com
    kind: Issuer
    name: firefly
