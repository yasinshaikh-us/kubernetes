apiVersion: v1
kind: Namespace
metadata:
  name: nginx
  labels:
    istio-injection: enabled   # pods get an Envoy sidecar, which exercises the mesh
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: nginx
spec:
  replicas: 2
  selector:
    matchLabels: { app: nginx }
  template:
    metadata:
      labels: { app: nginx }
    spec:
      containers:
        - name: nginx
          image: nginx:1.29-alpine
          ports: [{ containerPort: 80 }]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
          readinessProbe:
            httpGet: { path: /, port: 80 }
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: nginx
spec:
  selector: { app: nginx }
  ports: [{ name: http, port: 80, targetPort: 80 }]
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: nginx
  namespace: nginx
spec:
  hosts: ["nginx.${DOMAIN}"]
  gateways: ["istio-system/public"]
  http:
    - route:
        - destination: { host: nginx.nginx.svc.cluster.local, port: { number: 80 } }
